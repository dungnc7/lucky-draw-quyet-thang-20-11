name: Shared theme integration
on:
  pull_request:
    paths:
      - 'index.html'
      - 'cloud-theme-*.js'
      - 'cloud-theme.css'
      - 'firestore.rules'
      - 'tests/shared-theme-contract.cjs'
      - '.github/workflows/shared-theme-check.yml'
  push:
    branches: [main]
    paths:
      - 'cloud-theme-*.js'
      - 'firestore.rules'
      - 'tests/shared-theme-contract.cjs'
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/shared-theme-contract.cjs
