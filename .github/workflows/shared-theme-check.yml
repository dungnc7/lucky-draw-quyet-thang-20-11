name: Shared event settings security and integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/preflight.py
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_publication.py'
      - name: Test actual Firestore Security Rules against a demo-only emulator
        run: npx -y firebase-tools@latest emulators:exec --only firestore,auth --project demo-lucky-theme-security 'npm run test:rules'
      - run: git diff --check
