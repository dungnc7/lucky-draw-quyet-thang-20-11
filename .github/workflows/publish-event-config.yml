name: Publish event configuration
on:
  workflow_dispatch:
    inputs:
      configuration_base64:
        description: Locally validated public draft JSON, base64 encoded by scripts/publish_config.py
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-event-configuration
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Decode bounded proposal (data only)
        env:
          CONFIGURATION_BASE64: ${{ inputs.configuration_base64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ['CONFIGURATION_BASE64']
          if len(value) > 45000:
              raise SystemExit('Proposal too large')
          data = base64.b64decode(value, validate=True)
          if len(data) > 32768:
              raise SystemExit('Proposal too large')
          Path('/tmp/event-configuration-proposal.json').write_bytes(data)
          PY
      - name: Validate against current revision and prepare next immutable version
        run: python3 scripts/publish_config.py --input /tmp/event-configuration-proposal.json --apply
      - name: Validate source, approved draw rules and public configuration
        run: |
          python3 scripts/preflight.py
          node --test tests/test-v24.cjs
          python3 -m unittest discover -s tests -p 'test_publication.py'
          git diff --check
      - name: Commit public configuration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/published.json config/versions/
          git commit -m 'Publish validated event configuration'
          git push origin HEAD:main
      - name: Request Pages build for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
